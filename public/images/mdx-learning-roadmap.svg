  <path d="M748 326H808" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
  <path d="M438 306L458 326L438 346" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M794 306L814 326L794 346" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="108" y="478" width="984" height="114" rx="24" fill="#0F172A"/>
  <text x="144" y="530" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="24" font-weight="700">核心思路</text>
  <text x="144" y="570" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="20">不要一开始把所有能力堆进去，先让页面、数据、路由、内容系统按顺序稳定下来。</text>
